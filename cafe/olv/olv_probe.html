<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>WUT Cafe OLV Probe</title>
    <style>
        body { margin: 0; padding: 24px; font-family: sans-serif; background: #eeeeee; color: #323232; }
        .box { width: 760px; margin: 0 auto 18px; padding: 20px; background: #fff; border-radius: 18px; -webkit-border-radius: 18px; box-shadow: 0 3px 10px rgba(0,0,0,.25); -webkit-box-shadow: 0 3px 10px rgba(0,0,0,.25); }
        h1 { margin: 0 0 16px; color: #58bf00; font-size: 32px; }
        p { margin: 8px 0; font-size: 22px; }
        .yes { color: #3caa00; font-weight: bold; }
        .no { color: #969696; }
        #mii { display: block; width: 128px; height: 128px; margin: 18px auto 0; background: #f4f4f4; border-radius: 12px; -webkit-border-radius: 12px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>WUT Identity Probe</h1>
        <p id="console-state">Console context: checking...</p>
        <p id="token-state">ServiceToken: checking...</p>
        <p id="param-state">ParamPack: checking...</p>
        <p id="identity-state">Identity: checking...</p>
        <p id="profile-state">Profile: checking...</p>
        <img id="mii" src="res/olv/mii/img_unknown_MiiIcon.png" alt="Current Mii">
    </div>

    <script src="script/olv_store.js"></script>
    <script src="script/olv_session.js"></script>
    <script src="script/olv_identity.js"></script>
    <script src="script/olv_mii.js"></script>
    <script>
    (function () {
        "use strict";

        function set(id, label, yes, value) {
            var node = document.getElementById(id);
            if (!node) { return; }
            node.className = yes ? "yes" : "no";
            node.innerHTML = label + ": " + value;
        }

        function render() {
            var s = window.WUTSession.getState();
            var mii = document.getElementById("mii");

            set("console-state", "Console context", s.consoleContext, s.consoleContext ? "detected" : "not detected");
            set("token-state", "ServiceToken", s.serviceTokenPresent, s.serviceTokenPresent ? "header present" : "not present");
            set("param-state", "ParamPack", s.paramPackPresent, s.paramPackPresent ? "header present" : "not present");
            set("identity-state", "Identity", s.identityResolved, s.identityResolved ? ((s.pnid || s.userId || s.pid || "resolved") + " via " + s.identitySource) : "not resolved");
            set("profile-state", "Setup", s.setupComplete, (s.gameExperience || "no skill") + (s.setupComplete ? ", complete" : ", incomplete"));

            if (window.WUTMii) {
                window.WUTMii.bindImage(mii, "res/olv/mii/img_unknown_MiiIcon.png", 128, "face");
            }
        }

        window.addEventListener("wut:session-ready", render, false);
        window.addEventListener("wut:identity-ready", render, false);
        render();
    }());
    </script>
</body>
</html>
